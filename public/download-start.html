<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .box {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }
    p {
      font-size: 1.125rem;
      margin: 0 0 1rem;
    }
    .hint {
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="box">
    <p>Your download is starting…</p>
    <p class="hint">If nothing happens, <a href="/download">tap here</a>.</p>
  </div>
  <script>
    window.setTimeout(function () {
      window.location.replace("/download");
    }, 1000);
  </script>
</body>
</html>
